<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wellness Case Tracker</title>
<link rel="stylesheet" href="/styles.css" />
<script>
  // Applies the saved theme before first paint, so there's no flash of the
  // wrong theme. window.WCT_THEME is the single source of truth the
  // Appearance view (in app.js) reads and writes through.
  (function () {
    var KEY = 'wct_theme';
    function apply(pref) {
      var root = document.documentElement;
      if (pref === 'light' || pref === 'dark') root.setAttribute('data-theme', pref);
      else root.removeAttribute('data-theme');
    }
    var saved = localStorage.getItem(KEY) || 'system';
    apply(saved);
    window.WCT_THEME = {
      get: function () { return localStorage.getItem(KEY) || 'system'; },
      set: function (pref) { localStorage.setItem(KEY, pref); apply(pref); },
    };
  })();
</script>
</head>
<body>

<div id="authRoot" class="auth-screen" style="display:none"></div>

<div id="app" style="display:none">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">W</span>
      <span class="brand-text">Wellness Tracker</span>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-view="recordsSearch">Student Records</button>
      <button class="nav-item" data-view="sourceSis">SIS</button>
      <button class="nav-item" data-view="sourceHousing">Housing</button>
      <button class="nav-item" data-view="sourceCampusSafety">Campus Safety</button>
      <button class="nav-item" data-view="sourceAcademicIntegrity">Academic Integrity</button>
      <button class="nav-item" data-view="sourceWebReports">Web/Anonymous Reports</button>
      <div class="nav-divider"></div>
      <button class="nav-item" data-view="log" id="navWellnessToggle">Wellness</button>
    </nav>
    <nav class="nav" id="navWellness" style="display:none">
      <button class="nav-item" data-view="log">Case Log</button>
      <button class="nav-item" data-view="students">Students</button>
      <button class="nav-item" data-view="dashboard">Dashboard</button>
      <button class="nav-item" data-view="template">Template</button>
      <button class="nav-item" data-view="appearance">Appearance</button>
      <div class="nav-divider" id="adminNavDivider" style="display:none"></div>
      <button class="nav-item" data-view="import" id="navImport" style="display:none">Import</button>
      <button class="nav-item" data-view="team" id="navTeam" style="display:none">Team</button>
      <button class="nav-item" data-view="audit" id="navAudit" style="display:none">Audit Log</button>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <span class="user-avatar" id="userAvatar">–</span>
        <div class="user-chip-text">
          <div class="user-chip-name" id="userName">—</div>
          <div class="user-chip-role" id="userRole">—</div>
        </div>
        <button class="icon-btn" id="logoutBtn" title="Log out">
          <svg viewBox="0 0 20 20" width="16" height="16"><path d="M8 4H5a1 1 0 00-1 1v10a1 1 0 001 1h3M13 7l3 3-3 3M16 10H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="footer-line muted" id="entryCountFooter">— entries</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="semester-wrap">
        <select id="semesterSelect" class="semester-select">
          <option value="all">All Semesters</option>
        </select>
        <button class="btn small ghost" id="newSemesterBtn" title="Create a new semester">+ Semester</button>
        <button class="btn small ghost" id="deleteSemesterBtn" title="Delete this semester" style="display:none">Delete</button>
      </div>
      <div class="search-wrap">
        <input id="search" type="text" placeholder="Search students, notes, program…" />
      </div>
      <div class="topbar-actions">
        <button class="btn" id="exportBtn">Export CSV</button>
        <button class="btn primary" id="newEntryBtn">+ New Entry</button>
      </div>
    </header>
    <div class="view-root" id="view-root"></div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast-stack" id="toastStack"></div>

<div class="idle-overlay" id="idleOverlay" style="display:none">
  <div class="idle-modal">
    <div class="idle-title">Still there?</div>
    <div class="idle-body">For your security, you'll be signed out after 15 minutes of inactivity.<br />Signing out in <b id="idleCountdown">60</b> seconds.</div>
    <button class="btn primary full-width" id="idleStayBtn">Stay Signed In</button>
  </div>
</div>

<script src="/config.js"></script>
<script src="/auth.js"></script>
<script src="/app.js"></script>
<script src="/import.js"></script>
<script src="/records.js"></script>
</body>
</html>
